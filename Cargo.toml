[workspace]
members = [
    "rust/scx_arena/scx_arena",
    "rust/scx_arena/selftests",
    "rust/scx_bpf_unittests",
    "rust/scx_cargo",
    "rust/scx_raw_pmu",
    "rust/scx_rustland_core",
    "rust/scx_stats",
    "rust/scx_stats/scx_stats_derive",
    "rust/scx_userspace_arena",
    "rust/scx_utils",
    "scheds/rust/scx_beerland",
    "scheds/rust/scx_bpfland",
    "scheds/rust/scx_cake",
    "scheds/rust/scx_chaos",
    "scheds/rust/scx_cosmos",
    "scheds/rust/scx_flash",
    "scheds/rust/scx_lavd",
    "scheds/rust/scx_layered",
    "scheds/rust/scx_mitosis",
    "scheds/rust/scx_p2dq",
    "scheds/rust/scx_pandemonium",
    "scheds/rust/scx_rustland",
    "scheds/rust/scx_rusty",
    "scheds/rust/scx_tickless",
    "scheds/experimental/scx_alps",
    "scheds/experimental/scx_cfifo",
    "scheds/experimental/scx_cfs",
    "scheds/experimental/scx_rr",
    "scheds/experimental/scx_eevdf",
    "scheds/experimental/scx_flow",
    "scheds/experimental/scx_hybrid",
    "scheds/experimental/scx_rl_exec",
    "scheds/experimental/scx_rl_res",
    "scheds/experimental/scx_rlfifo",
    "scheds/experimental/scx_sfs",
    "tools/scxcash",
    "tools/scxtop",
    "tools/vmlinux_docify",
    "tools/xtask",
]
resolver = "2"

[profile.release]
lto = "thin"

[profile.release-tiny]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 32
panic = "abort"

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
strip = true
lto = false
