[package]
name = "scx_rl_exec"
version = "0.1.0"
authors = ["Yuxuan Zhao"]
edition = "2021"
description = "RL (Dueling-DQN) user-space scheduler optimizing total task execution time (accumulated runtime): the agent learns per-task core placement and the global time slice"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
plain = "0.2"
procfs = "0.18"
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "=0.26.2"
libc = "0.2"
# Embeds the CPython interpreter so the agent can call the torch DQN in
# py/q_learning.py (the same agent/model used by the ghOSt reference port).
pyo3 = { version = "0.26", features = ["auto-initialize"] }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.1" }
scx_rustland_core = { path = "../../../rust/scx_rustland_core", version = "2.4.12" }

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.1" }
scx_rustland_core = { path = "../../../rust/scx_rustland_core", version = "2.4.12" }

[features]
enable_backtrace = []
